<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner glow border -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.3" />

  <!-- Decorative Store & POS Graphic in Safe Zone -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Store Roof Awning Stripes -->
    <path d="M 120 180 L 150 130 L 362 130 L 392 180 Z" fill="#ffffff" />
    <polygon points="120,180 150,130 180,130 160,180" fill="url(#roofGrad)" />
    <polygon points="200,180 215,130 245,130 235,180" fill="url(#roofGrad)" />
    <polygon points="275,180 280,130 310,130 310,180" fill="url(#roofGrad)" />
    <polygon points="350,180 345,130 362,130 392,180" fill="url(#roofGrad)" />

    <!-- Awning Scallops -->
    <circle cx="140" cy="180" r="14" fill="#ffffff" />
    <circle cx="180" cy="180" r="14" fill="url(#roofGrad)" />
    <circle cx="220" cy="180" r="14" fill="#ffffff" />
    <circle cx="260" cy="180" r="14" fill="url(#roofGrad)" />
    <circle cx="300" cy="180" r="14" fill="#ffffff" />
    <circle cx="340" cy="180" r="14" fill="url(#roofGrad)" />
    <circle cx="376" cy="180" r="14" fill="#ffffff" />

    <!-- Store Front Window & Building -->
    <rect x="136" y="184" width="240" height="150" rx="12" fill="#ffffff" />
    <rect x="150" y="200" width="100" height="114" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="3" />
    <rect x="262" y="200" width="100" height="114" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="3" />

    <!-- Shopping Basket Icon inside window -->
    <path d="M 170 245 L 230 245 L 222 285 L 178 285 Z" fill="#0d9488" />
    <path d="M 185 245 Q 200 220 215 245" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" />

    <!-- Barcode lines on right window -->
    <line x1="280" y1="225" x2="280" y2="280" stroke="#0f766e" stroke-width="5" stroke-linecap="round" />
    <line x1="292" y1="225" x2="292" y2="280" stroke="#0f766e" stroke-width="3" stroke-linecap="round" />
    <line x1="302" y1="225" x2="302" y2="280" stroke="#0f766e" stroke-width="7" stroke-linecap="round" />
    <line x1="318" y1="225" x2="318" y2="280" stroke="#0f766e" stroke-width="4" stroke-linecap="round" />
    <line x1="330" y1="225" x2="330" y2="280" stroke="#0f766e" stroke-width="6" stroke-linecap="round" />
    <line x1="344" y1="225" x2="344" y2="280" stroke="#0f766e" stroke-width="3" stroke-linecap="round" />

    <!-- Red Laser Scan line across barcode -->
    <line x1="270" y1="252" x2="354" y2="252" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Banner RIYAN STORE -->
  <g filter="url(#shadow)">
    <rect x="96" y="360" width="320" height="58" rx="29" fill="url(#goldGrad)" />
    <text x="256" y="398" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#042f2e" letter-spacing="2">RIYAN STORE</text>
  </g>

  <!-- Subtitle POS & SEMBAKO -->
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" letter-spacing="4">KASIR POS &amp; SEMBAKO</text>
</svg>
